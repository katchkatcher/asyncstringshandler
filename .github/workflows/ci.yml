name: Cross-Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and run example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Run CTest
        run: ctest --preset default --output-on-failure

      - name: Run example
        run: ./build/examples/client/async_strings_handler_example${{ runner.os == 'Windows' && '.exe' || '' }} 4

      - name: Run benchmark smoke test
        run: ./build/benchmarks/async_strings_handler_benchmark${{ runner.os == 'Windows' && '.exe' || '' }} 100

  static-analysis:
    name: Clang-Tidy and Cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-tidy cppcheck

      - name: Configure
        run: cmake --preset clang-tidy

      - name: Build with static analysis
        run: cmake --build --preset clang-tidy --parallel

      - name: Run CTest
        run: ctest --test-dir build-clang-tidy --output-on-failure
