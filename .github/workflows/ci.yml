name: Cross-Platform CI

on: [push, pull_request]

jobs:
  test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ninja
      uses: asmodehn/setup-ninja@master

    - name: Configure CMake
      run: cmake --preset default

    - name: Build Project
      run: cmake --build --preset default

    - name: Run Tests
      run: ctest --preset default --output-on-failure

    - name: Run Example (Sanity Check)
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./build/examples/client/async_strings_handler_example.exe 4
        else
          ./build/examples/client/async_strings_handler_example 4
        fi

    - name: Run Benchmark
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./build/benchmarks/async_strings_handler_benchmark.exe 100
        else
          ./build/benchmarks/async_strings_handler_benchmark 100
        fi